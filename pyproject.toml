[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peppo"
version = "0.1.0"
description = "Python Performance POrtability framework"
authors = [
	{ name = "Mei Matteo", email = "teomei68@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"

# runtime dependencies
dependencies = [
	"llvmlite"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
python_files = "tests/*.py"
